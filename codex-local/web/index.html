<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex 本機對話列印</title><link data-export-style rel="stylesheet" href="vendor/katex/katex.min.css"><link data-export-style rel="stylesheet" href="style.css"></head>
<body>
<aside class="controls"><header><span class="logo">C↗</span><div><h1 data-i18n="app">Codex 對話列印</h1><small data-i18n="subtitle">本機讀取 · PDF / Markdown / JSON</small></div></header><label class="language-label">Language<select id="language" aria-label="Language"><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></label>
<label><span data-i18n="search">搜尋本機對話</span><input id="search" type="search" data-i18n-placeholder="searchHint" placeholder="對話名稱或專案資料夾"></label><button id="refresh" data-i18n="refresh">重新整理對話清單</button><div id="sessions" aria-label="對話清單"></div>
<p class="privacy" data-i18n="privacy">僅讀取這台 Mac 的 Codex 記錄，不會建立分享連結或上傳對話。使用完畢可關閉啟動工具的終端機視窗。</p></aside>
<main><section class="controls toolbar"><div><strong id="chat-title" data-i18n="choose">請先選擇對話</strong><p id="status" role="status" data-i18n="loading">正在讀取本機對話清單…</p></div><div class="actions"><button id="md" disabled data-i18n="md">下載 Markdown</button><button id="json" disabled data-i18n="json">下載 JSON</button><select id="file-format" aria-label="Export format"><option value="html">HTML</option><option value="txt">TXT</option><option value="docx">DOCX · Word</option></select><button id="export-file" data-i18n="downloadFile" disabled>下載檔案</button><button id="print" class="primary" disabled data-i18n="print">列印／另存 PDF</button></div></section>
<section class="controls settings"><label><span data-i18n="title">文件標題</span><input id="title" data-i18n-placeholder="titleHint" placeholder="沿用對話名稱"></label><label><span data-i18n="font">字體大小</span><select id="font"><option>10</option><option selected>12</option><option>14</option><option>16</option></select></label><label class="check"><input type="checkbox" id="progress"><span data-i18n="progress">包含工作進度訊息</span></label><label class="check"><input type="checkbox" id="allow-missing"><span data-i18n="missing">允許略過無法載入的圖片</span></label><div class="selection"><button id="all" data-i18n="all">全選</button><button id="answers" data-i18n="answers">只選 Codex 回答</button><button id="none" data-i18n="none">清空</button><span id="count"></span></div></section>
<section id="empty" class="empty"><h2 data-i18n="emptyTitle">直接列印 Codex 本機對話</h2><p data-i18n="emptyBody">從左側選對話，再勾選需要的訊息。PDF 預設 12 pt，保留表格、數學式、Mermaid 流程圖與仍可取得的本機圖片。</p><p data-i18n="printHelp">瀏覽器列印視窗中，目的地請選「另存為 PDF」。Safari 可在列印視窗下方的 PDF 選單儲存。</p></section>
<div id="document"><header id="document-head"></header><div id="messages"></div></div>
</main><script src="vendor/markdown-it.min.js"></script><script src="vendor/katex/katex.min.js"></script><script src="vendor/mermaid.min.js"></script><script src="i18n.js"></script><script src="vendor/docx.js"></script><script src="export-formats.js"></script><script src="app.js"></script></body></html>
